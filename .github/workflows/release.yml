name: Release (Windows exe)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
      - name: Build exe
        run: node scripts/build-exe.mjs
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $env:PORT = '3199'
          $env:ADMIN_PASSWORD = 'smoke-pass-1'
          $env:OPEN_BROWSER = '0'
          $p = Start-Process -FilePath "$PWD/release/FactorMaker/FactorMaker.exe" -WorkingDirectory "$PWD/release/FactorMaker" -PassThru -RedirectStandardOutput "$PWD/exe-out.log" -RedirectStandardError "$PWD/exe-err.log"
          try { node scripts/smoke.mjs http://127.0.0.1:3199 smoke-pass-1; $code = $LASTEXITCODE }
          finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Write-Host "----- exe stdout -----"; Get-Content "$PWD/exe-out.log" -ErrorAction SilentlyContinue
            Write-Host "----- exe stderr -----"; Get-Content "$PWD/exe-err.log" -ErrorAction SilentlyContinue
          }
          if ($code -ne 0) { throw "smoke failed" }
      - name: Update flow smoke test (fake GitHub, public repo)
        shell: pwsh
        run: node scripts/update-smoke.mjs
      - name: Update flow smoke test (fake GitHub, private repo with token)
        shell: pwsh
        env:
          SMOKE_MODE: token
        run: node scripts/update-smoke.mjs
      - name: Package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force release/FactorMaker/data -ErrorAction SilentlyContinue
          Compress-Archive -Path release/FactorMaker -DestinationPath FactorMaker-win-x64.zip
          $h = (Get-FileHash FactorMaker-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$h  FactorMaker-win-x64.zip" | Out-File -FilePath FactorMaker-win-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: FactorMaker-win-x64
          path: |
            FactorMaker-win-x64.zip
            FactorMaker-win-x64.zip.sha256
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$ver"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release upload $tag FactorMaker-win-x64.zip FactorMaker-win-x64.zip.sha256 --clobber }
          else { gh release create $tag FactorMaker-win-x64.zip FactorMaker-win-x64.zip.sha256 --target "${{ github.sha }}" --title "FactorMaker $tag" --notes "نسخه‌ی اجرایی ویندوز: فایل zip را باز کنید و FactorMaker.exe را اجرا کنید. راهنما: README.txt داخل zip. ساخت PDF به Chrome یا Edge نیاز دارد." }
